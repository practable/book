        type: array
        items: {$ref: '#/definitions/BookingActivationStage'}
      cleanup_stages:
        type: array
        items: {$ref: '#/definitions/BookingActivationStage'}
    
  ActivityStream:
    title: stream
    description: Represents an assigned, valid booking slot for an individual piece of equipment
    type: object
    properties:
      audience:
        type: string
      connection_type:
        type: string
      for:
        description: Describes the stream, and doubles as template key in the URL
        example: video
        type: string
      prefix:
        description: prefix of the relay routing
        example: session
        type: string
      scopes:
        type: array
        items:
          type: string
      topic:
        type: string
      token:
        description: signed jwt token for accessing the stream
        type: string
      url:
