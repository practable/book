swagger: '2.0'
info:
  version: '0.5'
  title: AdvanceBooking
  description: User API for booking slots in advance
  contact:
    email: timothy.d.drysdale@gmail.com
    name: Tim Drysdale
    url: https://practable.io
host: book.practable.io
basePath: /api/v1
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header 
schemes:
  - http
consumes:
- application/json
- text/plain
produces:
- application/json
- text/plain

paths:

  /admin/bookings:
    get:
      description: Exports a copy of the current bookings, with sufficient information to allow editing and replacement. If successful produces JSON-formatted bookings list.
      summary: Export a copy of all current bookings
      tags:
      - admin
      operationId: ExportBookings
      deprecated: false
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/Bookings'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      summary: Replace current bookings 
      description: Deletes all current bookings, refunds usage to users, and then replaces with current bookings. Existing users are retained, new users are created as required to match bookings.
      tags:
      - admin
      operationId: ReplaceBookings
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: bookings
        in: body
        required: true
        schema:
          $ref: '#/definitions/Bookings'
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/StoreStatusAdmin'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /admin/bookings/{booking_name}:
    get:
      summary: Export one current booking for editing
      description: Returns the booking together with the opaque revision required to replace it. Preserve the envelope when editing and upload it with PUT.
      tags:
      - admin
      operationId: ExportBookingForEdit
      produces:
      - application/json
      parameters:
      - name: booking_name
        in: path
        required: true
        type: string
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/BookingEdit'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      summary: Atomically replace one unstarted booking
      description: Supersedes the original booking and inserts the replacement in one transaction. The supplied original name and revision must match the exported edit envelope. Exact retries are idempotent; stale, started, or conflicting edits return 409.
      tags:
      - admin
      operationId: ReplaceBooking
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: booking_name
        in: path
        required: true
        type: string
      - name: booking_edit
        in: body
        required: true
        schema:
          $ref: '#/definitions/BookingEdit'
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/BookingEdit'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        409:
          $ref: '#/responses/Conflict'
        500:
          $ref: '#/responses/InternalError'

  /admin/booking-records:
    get:
      summary: Search current and historical bookings
      description: Returns a bounded operational projection without exposing booking data through bulk export syntax.
      tags: [admin]
      operationId: QueryBookingRecords
      parameters:
      - {name: resource, in: query, type: string}
      - {name: slot, in: query, type: string}
      - {name: policy, in: query, type: string}
      - {name: user, in: query, type: string}
      - {name: state, in: query, type: string, enum: [all, current, history, started, cancelled, unfulfilled], default: all}
      - {name: from, in: query, type: string, format: date-time}
      - {name: to, in: query, type: string, format: date-time}
      - {name: limit, in: query, type: integer, format: int64, minimum: 1, maximum: 1000, default: 200}
      security:
      - Bearer: []
      responses:
        200:
          description: OK
          schema:
            type: array
            items: {$ref: '#/definitions/AdminBookingRecord'}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/bookings/{booking_name}/events:
    get:
      summary: Get the durable audit trail for a booking
      tags: [admin]
      operationId: GetBookingEvents
      parameters:
      - {name: booking_name, in: path, required: true, type: string}
      security:
      - Bearer: []
      responses:
        200:
          description: OK
          schema:
            type: array
            items: {$ref: '#/definitions/BookingEvent'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        500: {$ref: '#/responses/InternalError'}

  /admin/manifest:
    get:
      summary: Export the manifest
      description: Export the manifest (resources, slots, policies, descriptions etc). Does not include bookings or users
      tags:
      - admin
      operationId: ExportManifest
      deprecated: false
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Manifest'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
    put:
      summary: Replace the manifest
      description: Delete the existing manifest and replace it with a new one. All items have specified names so bookings do not need updating (except perhaps you should if booked resources have been removed) 
      tags:
      - admin
      operationId: ReplaceManifest
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: manifest
        in: body
        required: true
        schema:
          $ref: '#/definitions/Manifest'
      security:
        - Bearer: []  
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/StoreStatusAdmin'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'  
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /admin/manifest/check:
    get:
      summary: Check a manifest
      description: Check a manifest is valid. Returns 204 if valid or, 200 with a list of error(s).
      tags:
      - admin
      operationId: CheckManifest
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: manifest
        in: body
        required: true
        schema:
          $ref: '#/definitions/Manifest'
      security:
        - Bearer: []
      responses:
        200:
          $ref: '#/responses/ErrorList'
        204:
          description: OK - manifest is valid
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
            
  /admin/oldbookings:
    get:
      summary: Export a copy of all old bookings
      description: Exports a copy of the old bookings, with sufficient information to allow editing and replacement. If successful produces JSON-formatted bookings list. 
      tags:
      - admin
      operationId: ExportOldBookings
      deprecated: false
      produces:
      - application/json  
      security:
        - Bearer: []
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/Bookings'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      summary: Replace old bookings 
      description: Deletes all old bookings, and all users, then replaces both according to the bookings in the request, i.e. users and their usage are created as required to match bookings.
      tags:
      - admin
      operationId: ReplaceOldBookings
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: bookings
        in: body
        required: true
        schema:
          $ref: '#/definitions/Bookings'
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/StoreStatusAdmin'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /admin/resources:
    get:
      description: Gets a list of all resources, including their availability and any tests specified
      summary: Get the list of resources in the manifest
      tags:
      - admin
      operationId: GetResources
      deprecated: false
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Resources'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /admin/operations:
    get:
      summary: Get operational dashboard summary
      description: Returns the active manifest version, store status, and effective availability for every resource and slot in one admin request.
      tags:
      - admin
      operationId: GetOperationalStatus
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/OperationalStatus'
        401:
          $ref: '#/responses/Unauthorized'
        500:
          $ref: '#/responses/InternalError'

  /admin/operational-occurrences:
    get:
      summary: List scheduled operational occurrences
      description: Returns a bounded authoritative list of planned, skipped, conflicted, or missed schedule occurrences.
      tags: [admin]
      operationId: ListOperationalOccurrences
      produces: [application/json]
      security:
        - Bearer: []
      parameters:
      - {name: from, in: query, type: string, format: date-time}
      - {name: until, in: query, type: string, format: date-time}
      - {name: state, in: query, type: string, enum: [planned, skipped, conflict, missed]}
      - {name: limit, in: query, type: integer, format: int64, minimum: 1, maximum: 500, default: 200}
      responses:
        200:
          description: OK
          schema:
            type: array
            items: {$ref: '#/definitions/OperationalOccurrence'}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/operational-alerts:
    get:
      summary: List actionable operational alerts
      tags: [admin]
      operationId: ListOperationalAlerts
      produces: [application/json]
      security: [{Bearer: []}]
      parameters:
      - {name: status, in: query, type: string, enum: [active, open, acknowledged, resolved, all], default: active}
      - {name: limit, in: query, type: integer, format: int64, minimum: 1, maximum: 1000, default: 200}
      responses:
        200:
          description: OK
          schema: {type: array, items: {$ref: '#/definitions/OperationalAlert'}}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/operational-alerts/{alert_id}/acknowledge:
    post:
      summary: Acknowledge an operational alert
      tags: [admin]
      operationId: AcknowledgeOperationalAlert
      produces: [application/json]
      security: [{Bearer: []}]
      parameters:
      - {name: alert_id, in: path, required: true, type: integer, format: int64}
      responses:
        200: {description: OK, schema: {$ref: '#/definitions/OperationalAlert'}}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        500: {$ref: '#/responses/InternalError'}

  /admin/operational-alerts/{alert_id}/resolve:
    post:
      summary: Resolve an operational alert without changing technician suspension
      tags: [admin]
      operationId: ResolveOperationalAlert
      produces: [application/json]
      security: [{Bearer: []}]
      parameters:
      - {name: alert_id, in: path, required: true, type: integer, format: int64}
      responses:
        200: {description: OK, schema: {$ref: '#/definitions/OperationalAlert'}}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        500: {$ref: '#/responses/InternalError'}

  /admin/operational-health:
    get:
      summary: List latest automated stream-health decisions
      tags: [admin]
      operationId: ListOperationalHealth
      produces: [application/json]
      security: [{Bearer: []}]
      responses:
        200:
          description: OK
          schema: {type: array, items: {$ref: '#/definitions/OperationalStreamHealth'}}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/resources/{resource_name}/streams/{stream_name}/health-checks:
    post:
      summary: Reserve a resource and run its manifest-approved stream health pipeline
      tags: [admin]
      operationId: BeginOperationalHealthCheck
      produces: [application/json]
      security: [{Bearer: []}]
      parameters:
      - {name: resource_name, in: path, required: true, type: string}
      - {name: stream_name, in: path, required: true, type: string}
      - {name: Idempotency-Key, in: header, required: true, type: string, minLength: 1, maxLength: 200}
      responses:
        202: {description: Health check reserved and queued, schema: {$ref: '#/definitions/BookingActivation'}}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /admin/resource-holds:
    get:
      summary: List resources deliberately held offline by technicians
      tags: [admin]
      operationId: ListResourceHolds
      produces: [application/json]
      security: [{Bearer: []}]
      responses:
        200:
          description: OK
          schema: {type: array, items: {$ref: '#/definitions/ResourceHold'}}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/resource-holds/{resource_name}/release:
    post:
      summary: Request verified release or explicitly release as degraded
      description: Atomically records a pending release and queues one durable maintenance activation covering every manifest-designated health-check stream. The resource remains held until each stream passes once. Providing override_reason performs an explicit degraded release instead.
      tags: [admin]
      operationId: RequestResourceRelease
      produces: [application/json]
      security: [{Bearer: []}]
      parameters:
      - {name: resource_name, in: path, required: true, type: string}
      - {name: override_reason, in: query, type: string}
      responses:
        202: {description: Verification requested or degraded release recorded, schema: {$ref: '#/definitions/ResourceReleaseState'}}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /admin/resource-releases:
    get:
      summary: List pending, verified, and degraded resource releases
      tags: [admin]
      operationId: ListResourceReleases
      produces: [application/json]
      security: [{Bearer: []}]
      responses:
        200: {description: OK, schema: {type: array, items: {$ref: '#/definitions/ResourceReleaseState'}}}
        401: {$ref: '#/responses/Unauthorized'}
        500: {$ref: '#/responses/InternalError'}

  /admin/usage:
    get:
      summary: Get actual equipment usage
      description: Returns restart-safe actual use derived from booking activation, cancellation and end timestamps. Live bookings accrue to the report time.
      tags:
      - admin
      operationId: GetUsageSummary
      produces:
      - application/json
      parameters:
      - {name: resource, in: query, type: string}
      - {name: slot, in: query, type: string}
      - {name: policy, in: query, type: string}
      - {name: user, in: query, type: string}
      - {name: from, in: query, type: string, format: date-time}
      - {name: to, in: query, type: string, format: date-time}
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/UsageSummary'
        401:
          $ref: '#/responses/Unauthorized'
        500:
          $ref: '#/responses/InternalError'

  /admin/maintenance/bookings:
    post:
      summary: Create a maintenance booking
      description: Creates a resource-constrained booking for a technician. It may use suspended equipment but never overlaps any existing booking. Requires booking:maintenance or booking:admin.
      tags:
      - admin
      operationId: MakeMaintenanceBooking
      produces:
      - application/json
      parameters:
      - name: slot_name
        in: query
        required: true
        type: string
      - name: from
        in: query
        required: true
        type: string
        format: date-time
      - name: to
        in: query
        required: true
        type: string
        format: date-time
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Booking'
        401:
          $ref: '#/responses/Unauthorized'
        409:
          $ref: '#/responses/Conflict'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /admin/resources/{resource_name}/maintenance-bookings:
    post:
      summary: Create a maintenance booking by physical resource
      description: Selects an appropriate slot for the resource, may use suspended equipment, and never overlaps another resource-constrained booking.
      tags: [admin]
      operationId: MakeResourceMaintenanceBooking
      parameters:
      - {name: resource_name, in: path, required: true, type: string}
      - {name: from, in: query, required: true, type: string, format: date-time}
      - {name: to, in: query, required: true, type: string, format: date-time}
      security:
      - Bearer: []
      responses:
        200:
          description: OK
          schema: {$ref: '#/definitions/Booking'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /admin/booking-overrides/{booking_name}/cancel:
    post:
      summary: Cancel a booking for urgent maintenance
      description: Cancels an eligible booking with a mandatory operational reason. Requires booking:booking-override or booking:admin.
      tags:
      - admin
      operationId: OverrideCancelBooking
      parameters:
      - name: booking_name
        in: path
        required: true
        type: string
      - name: reason
        in: query
        required: true
        type: string
      security:
        - Bearer: []
      responses:
        204:
          description: OK
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        409:
          $ref: '#/responses/Conflict'
        500:
          $ref: '#/responses/InternalError'
    
      
  /admin/resources/{resource_name}:
    get:
      description: Gets availability of the named resource, including its status message. Resource suspension applies to every slot using that resource.
      summary: Get the availability of the resource
      tags:
      - admin
      operationId: GetResourceIsAvailable
      deprecated: false
      produces:
      - application/json
      parameters:
        - name: resource_name
          in: path
          type: string
          required: true            
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ResourceStatus'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      description: Sets the availability of a resource, including a status message. Used to prevent users accessing equipment that should not be used, e.g. after failing an automated test, or make it available again after fixing it.
      summary: Set the availability of the resource
      tags:
      - admin
      operationId: SetResourceIsAvailable
      deprecated: false
      parameters:
      - name: resource_name
        in: path
        type: string
        required: true   
      - name: available
        in: query
        type: boolean
        required: true
      - name: reason
        in: query
        type: string
        required: true
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        204:
          description: OK
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /admin/slots/{slot_name}:
    get:
      description: Gets the availability of the underlying resource for the slot, including a status message. Indicates when equipment is offline temprorarily, e.g. due to failing an automated test.
      summary: Get the availability of the slot
      tags:
      - admin
      operationId: GetSlotIsAvailable
      deprecated: false
      produces:
      - application/json
      parameters:
        - name: slot_name
          in: path
          type: string
          required: true            
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ResourceStatus'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      description: Sets availability for only the named slot, including a status message. Use the resource endpoint to suspend every slot sharing equipment after a failed health check.
      summary: Set the availability of the slot 
      tags:
      - admin
      operationId: SetSlotIsAvailable
      deprecated: false
      parameters:
      - name: slot_name
        in: path
        type: string
        required: true   
      - name: available
        in: query
        type: boolean
        required: true
      - name: reason
        in: query
        type: string
        required: true
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        204:
          description: OK
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /admin/status:
    get:
      description: Gets a count of the number of elements in the store, e.g. Bookings, Descriptions etc to facilitate a necessary but not sufficient check that replace manifest and replace bookings have produced the correct results.
      summary: Get current store status
      tags:
      - admin
      operationId: getStoreStatusAdmin
      deprecated: false
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/StoreStatusAdmin'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      description: Persistently pause or resume new booking creation. Reading, cancellation, and take-up remain available; resource or slot suspension controls unsafe take-up.
      summary: set/release booking lock
      tags:
      - admin
      operationId: setLock
      deprecated: false
      parameters:
      - name: lock
        in: query
        required: true
        type: boolean
        description: pause new booking creation
      - name: msg
        in: query
        required: false
        type: string
        description: set message of the day (use query so it can be seen in server logs)        
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/StoreStatusAdmin'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /admin/users:
    get:
      summary: Export users
      description: Export bookings and usage data for each user
      tags:
      - admin
      operationId: ExportUsers
      deprecated: false
      produces:
      - application/json
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Users'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /descriptions/{description_name}:
    get:
      summary: Get description 
      description: Get description
      tags:
      - users
      operationId: GetDescription
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: description_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []  
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Description'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'  
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /calendar/catalog/{group_name}:
    get:
      summary: Get the calendar-oriented experiment catalogue for a group
      description: Returns one experiment class per policy, including descriptions, recommended duration, booking increment, and candidate resources.
      tags:
      - users
      operationId: GetCalendarCatalogue
      parameters:
      - name: group_name
        in: path
        required: true
        type: string
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/CalendarCatalogue'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /calendar/availability:
    post:
      summary: Query aggregate availability for a calendar range
      description: Returns sampled availability counts for a policy pool optionally narrowed by resource or structured properties. It never reveals other users.
      tags:
      - users
      operationId: QueryCalendarAvailability
      parameters:
      - name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/CalendarAvailabilityRequest'
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/CalendarAvailability'
        400:
          $ref: '#/responses/BadRequest'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /calendar/preview:
    post:
      summary: Preview an exact calendar booking
      description: Validates policy, usage, resource matching, and current availability without reserving capacity. A successful preview is advisory and must be revalidated during creation.
      tags:
      - users
      operationId: PreviewCalendarBooking
      parameters:
      - name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/CalendarBookingRequest'
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/CalendarBookingPreview'
        400:
          $ref: '#/responses/BadRequest'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /calendar/bookings:
    post:
      summary: Create a selector-aware calendar booking
      description: Atomically assigns one matching resource and returns the booking. Exact retries with the same user and Idempotency-Key return the original booking; reuse for a different request returns 409.
      tags:
      - users
      operationId: MakeCalendarBooking
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        type: string
        minLength: 8
        maxLength: 200
      - name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/CalendarBookingRequest'
      security:
        - Bearer: []
      responses:
        200:
          description: Created or exact retry
          schema:
            $ref: '#/definitions/Booking'
        400:
          $ref: '#/responses/BadRequest'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        409:
          $ref: '#/responses/Conflict'
        500:
          $ref: '#/responses/InternalError'

  /calendar/bookings/{booking_name}:
    patch:
      summary: Move or resize an unstarted booking
      description: Revalidates ownership, policy, usage and availability, then atomically replaces the booking using an optimistic revision.
      tags: [users]
      operationId: RescheduleCalendarBooking
      parameters:
      - {name: booking_name, in: path, required: true, type: string}
      - name: request
        in: body
        required: true
        schema: {$ref: '#/definitions/CalendarBookingEdit'}
      security:
      - Bearer: []
      responses:
        200:
          description: OK
          schema: {$ref: '#/definitions/BookingEdit'}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /operations/jobs/{job_id}/callbacks:
    post:
      summary: Record a job-runner lifecycle callback
      description: Internal service endpoint authenticated by an HMAC over the exact request body, direction, timestamp, and delivery ID. Replaying an identical delivery is idempotent.
      tags: [operations]
      operationId: RecordOperationalJobCallback
      parameters:
      - {name: job_id, in: path, required: true, type: string}
      - {name: X-Book-Timestamp, in: header, required: true, type: string}
      - {name: X-Book-Delivery-ID, in: header, required: true, type: string}
      - {name: X-Book-Direction, in: header, required: true, type: string, enum: [runner-to-book]}
      - {name: X-Book-Signature, in: header, required: true, type: string}
      - name: callback
        in: body
        required: true
        schema: {$ref: '#/definitions/OperationalJobCallback'}
      responses:
        200:
          description: Callback recorded or exact replay acknowledged
          schema: {$ref: '#/definitions/OperationalJobCallbackResult'}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /operations/jobs/{job_id}/activate:
    post:
      summary: Activate an accepted operational job reservation
      description: Internal runner endpoint authenticated by a short-lived HMAC over the exact request. The job-to-booking binding is verified transactionally and exact retries are idempotent.
      tags: [operations]
      operationId: ActivateOperationalJob
      parameters:
      - {name: job_id, in: path, required: true, type: string}
      - {name: X-Book-Timestamp, in: header, required: true, type: string}
      - {name: X-Book-Delivery-ID, in: header, required: true, type: string}
      - {name: X-Book-Direction, in: header, required: true, type: string, enum: [runner-to-book]}
      - {name: X-Book-Signature, in: header, required: true, type: string}
      - name: activation
        in: body
        required: true
        schema: {$ref: '#/definitions/OperationalJobActivation'}
      responses:
        200:
          description: Reservation active; exact retries return the same activity
          schema: {$ref: '#/definitions/Activity'}
        400: {$ref: '#/responses/BadRequest'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}
          
  /groups/{group_name}:
    get:
      summary: Get group 
      description: Get fully described group, including described policies, and described slots
      tags:
      - users
      operationId: GetGroup
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: group_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/GroupDescribedWithPolicies'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /login/{user_name}:
    post:
      summary: Request a user access token
      description: The access token is required to authenticate requests to the rest of the user-facing API. Ideally access to this endpoint should be secured by the identity management system. The access token has a limited lifetime but can be re-requested as needed. Consider rate-limiting this per-connection.
      tags:
      - users
      operationId: GetAccessToken
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: user_name
        in: path
        required: true
        type: string
        description: ''
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/AccessToken'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /policies/{policy_name}:
    get:
      summary: Get policy
      description: Get policy
      tags:
      - users
      operationId: GetPolicy
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: policy_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/PolicyDescribed'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /slots/{slot_name}:
    get:
      summary: Get availability for the slot 
      description: Pagination is supported by the limit and offset parameters. For the first query '?limit=20&offset=0', the second '?limit=20&offset=20'. The offset is equal to the zero-indexed value of the first item of the next page to be returned (20 items are indexed from 0 to 19, so 20 is the first item to be returned in the second page). Note that drift can occur if slots are booked during the sending of availability data, potentially preventing a user from seeing some slots that move earlier in the index and cross a pagination boundary. Users should refresh their results from 0 offset on a regular-ish basis if they wish to avoid this.
      tags:
      - users
      operationId: GetAvailability
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: slot_name
        in: path
        required: true
        type: string
        description: ''
      - name: limit
        in: query
        type: integer
        required: false
      - name: offset
        in: query
        type: integer
        required: false
      security:
        - Bearer: []
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Intervals'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    post:
      summary: Request a booking
      description: A booking is requested for a specific combination of policy-slot-user-from-to. Users should check availability first, and only make requests that are likely to be granted. If there is no current availability then requests will be denied. If there is availability, there is still a chance another user requests the same slot just before - whichever request is received by the server first will be allowed, the other denied. The user_name must match the user_name the user logged in with, that is in the authorisation token in the header.
      tags:
      - users
      operationId: MakeBooking
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: slot_name
        in: path
        required: true
        type: string
        description: ''
      - name: user_name
        in: query
        required: true
        type: string
        description: ''
      - name: from
        in: query
        required: true
        type: string
        format: date-time
      - name: to
        in: query
        required: true
        type: string
        format: date-time
      security:
        - Bearer: []
      responses:
        204:
          description: 'OK - No Content'
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        409:
          description: 'Conflict - unavailable for the requested interval'
          schema: {}
        500:
          $ref: '#/responses/InternalError'
          
  /users/unique:
    post:
      summary: Request a new, unique username
      description: Generates a unique username that meets the minimum length requirements for the booking system. No security/token needed, because users needs a/this name to login
      tags:
      - users
      operationId: UniqueName
      deprecated: false
      produces:
