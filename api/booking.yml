definitions:

  OperationalOccurrence:
    type: object
    properties:
      schedule: {type: string}
      occurrence_at: {type: string, format: date-time}
      manifest_version: {type: integer, format: int64}
      state: {type: string, enum: [planned, skipped, conflict, missed]}
      slot: {type: string}
      resource: {type: string}
      workflow: {type: string}
      booking_name: {type: string}
      job_id: {type: string}
      detail: {type: string}
    required: [schedule, occurrence_at, manifest_version, state, slot, resource, workflow]

  OperationalJobActivation:
    type: object
    additionalProperties: false
    properties:
      version: {type: integer, format: int64, enum: [1]}
      job_id: {type: string}
      at: {type: string, format: date-time}
    required: [version, job_id, at]

  OperationalJobCallback:
    type: object
    additionalProperties: false
    properties:
      version: {type: integer, format: int64, enum: [1]}
      job_id: {type: string}
      state: {type: string, enum: [accepted, running, succeeded, failed, cancelled, expired]}
      at: {type: string, format: date-time}
      code: {type: string, description: Stable machine-readable result or failure code}
      error: {type: string}
    required: [version, job_id, state, at]

  OperationalJobCallbackResult:
    type: object
    properties:
      job_id: {type: string}
      state: {type: string}
      duplicate: {type: boolean}
    required: [job_id, state, duplicate]

  AccessToken:
    title: access token
    description: intended use is for users to access the API, and is tied to their user_name.
    type: object
    properties:
      token:
        type: string
      iat:
        description: Issued At
        type: number
        format: unix-timestamp
      nbf:
        description: Not before
        type: number
        format: unix-timestamp
      exp:
        description: Expires At
        type: number
        format: unix-timestamp
      aud:
        description: Audience
        type: string
      sub:
        description: Subject
        type: string
      scopes:
        description: List of scopes
        type: array
        items:
          type: string
          example: user:booking
    required:
    - token
    - nbf
    - exp
    - aud
    - sub
    - scopes
        
  Activity:
    title: activity
    description: An activity represents connection details to instances of pre-agreed resource types such as video, data streams and user interfaces.
    type: object
    properties:
      config:
        description: URL at which to GET the configuration object
        example: https://assets.practable.io/config/experiments/pvna/pvna01-0.0.json
        type: string
        format: url
      description:
        $ref: '#/definitions/Description'
      nbf:
        description: Expires At
        type: number
        format: unix-timestamp
      exp:
        description: Expires At
        type: number
        format: unix-timestamp
      streams:
        description: A list of streams
        type: array
        items:
          $ref: '#/definitions/ActivityStream'
      uis:
        description: User interfaces
        type: array
        items:
          $ref: '#/definitions/UIDescribed'
    required:
    - description
    - exp
    - nbf
    - streams
    - uis

  BookingActivationRequest:
    type: object
    properties:
      stream: {type: string, minLength: 1, maxLength: 200}

  BookingActivationStage:
    type: object
    required: [index, name, state, attempt, maximum_attempts]
    properties:
      index: {type: integer, format: int64, minimum: 0}
      name: {type: string}
      stream: {type: string}
      state:
        type: string
        enum: [waiting, pending, dispatched, accepted, running, succeeded, failed, cancelled, expired]
      attempt: {type: integer, format: int64, minimum: 0}
      maximum_attempts: {type: integer, format: int64, minimum: 1}
      progress_message: {type: string}
      last_error_code: {type: string}
      last_error: {type: string}

  BookingActivation:
    type: object
    required: [id, booking_name, stream, state, cleanup_state, current_stage, progress_message, stages]
    properties:
      id: {type: string}
      booking_name: {type: string}
      stream: {type: string}
      state:
        type: string
        enum: [preparing, active, failed, cancelled, expired, cleaning, closed, cleanup_failed]
      cleanup_state:
        type: string
        enum: [not_required, pending, running, succeeded, failed]
      current_stage: {type: integer, format: int64, minimum: 0}
      recovery_attempt: {type: integer, format: int64, minimum: 0}
      maximum_recovery_attempts: {type: integer, format: int64, minimum: 0, maximum: 5}
