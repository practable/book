      failing_streams: {type: array, items: {type: string}}
      requested_at: {type: string, format: date-time}
      requested_by: {type: string}
      manifest_version: {type: integer, format: int64}
      override_reason: {type: string}
      released_at: {type: string, format: date-time}

  UsageSummary:
    description: aggregate actual equipment use derived from booking lifecycle timestamps
    type: object
    properties:
      actual_usage:
        type: string
      preparation_usage:
        type: string
      cleanup_usage:
        type: string
      scheduled_usage:
        type: string
      operational_jobs:
        type: integer
        format: int64
      started_bookings:
        type: integer
        format: int64
      completed_bookings:
        type: integer
        format: int64
    required:
    - actual_usage
    - preparation_usage
    - cleanup_usage
    - scheduled_usage
    - operational_jobs
    - started_bookings
    - completed_bookings

  StoreStatusAdmin:
    type: object
    properties:
      locked:
        type: boolean
      message:
        type: string
      now:
        type: string
        format: date-time
      bookings:
        type: integer
      descriptions:
        type: integer
      filters:
        type: integer
      old_bookings:
         type: integer
      policies:
        type: integer
      resources:
        type: integer
      slots:
        type: integer
      streams:
        type: integer
      uis:
        type: integer
      ui_sets:
        type: integer
      users:
        type: integer
      windows:
        type: integer
    required:
      - locked
      - message
      - now
      - bookings
      - descriptions
      - filters
      - old_bookings
      - policies
      - resources
      - slots
      - streams
      - uis
      - ui_sets
      - users
      - windows
      
  StoreStatusUser:
    type: object
    properties:
      locked:
        type: boolean
      message:
        type: string
      now:
        type: string
        format: date-time
    required:
      - locked
      - message
      - now

  UI:
    title: User Interface
    type: object
    properties:
      url:
        description: template for the URL for the user interface
        example: https://static.practable.io/ui/penduino-basic.html?video={{video}}&data={{data}}
        type: string
      streams_required:
        description: list of names of required streams
        example: ["data","video"]
        type: array
        items:
          type: string
          example: video
          description: stream name
      description:
        type: string
    required:
    - url
    - description

  UIDescribed:
    title: User Interface with description including
    type: object
    properties:
      url:
        description: template for the URL for the user interface
        example: https://static.practable.io/ui/penduino-basic.html?video={{video}}&data={{data}}
        type: string
      streams_required:
        description: list of names of required streams
        example: ["data","video"]
        type: array
        items:
          type: string
          example: video
          description: stream name
      description:
        $ref: '#/definitions/Description'
    required:
    - url
    - description
    
  UISet:
    title: set of User Interfaces
    type: object
    properties:
      UIs:
       type: array
       items:
         type: string
      
  User:
    type: object
    properties:
      bookings:
        type: array
        items:
          type: string
      groups:
        type: array
        items:
          type: string
      old_bookings:
        type: array
        items:
          type: string
      usage:
        type: object
        additionalProperties:
          type: string
          
  UserName:
    type: object
    properties:
      user_name:
        type: string
        
  Users:
    title: set of Users (export only)
    type: object
    additionalProperties:
      $ref: '#/definitions/User'
      
  Window:
    type: object
    properties:
      allowed:
        type: array
        items:
          $ref: '#/definitions/Interval'
      denied:
        type: array
        items:
          $ref: '#/definitions/Interval'
      recurring_allowed:
        type: array
        items:
          $ref: '#/definitions/WeeklyRecurrence'
      recurring_denied:
        type: array
        items:
          $ref: '#/definitions/WeeklyRecurrence'

  WeeklyRecurrence:
    description: A finite weekly civil-time interval. end_date is inclusive and an end_time not after start_time denotes an overnight interval.
    type: object
    properties:
      timezone: {type: string, example: Europe/London}
      start_date: {type: string, format: date, example: '2026-09-14'}
      end_date: {type: string, format: date, example: '2026-12-18'}
      weekdays:
        type: array
        items: {type: string}
      start_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00'}
      end_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '17:00'}
      exceptions:
        type: array
        items: {type: string, format: date}
    required: [timezone, start_date, end_date, weekdays, start_time, end_time]

# Descriptions of common responses
responses:
  BadRequest:
    description: The request is malformed or exceeds calendar query limits
    schema:
      $ref: '#/definitions/Error'
  Conflict:
    description: The booking was changed, started, or conflicts with the proposed replacement
    schema:
      $ref: '#/definitions/Error'
  NotFound:
    description: The specified resource was not found
    schema:
      $ref: '#/definitions/Error'
  Unauthorized:
    description: Unauthorized
    schema:
      $ref: '#/definitions/Error'
  InternalError:
    description: Internal Error
    schema:
      $ref: '#/definitions/Error'
  ErrorList:
    description: List of errors (e.g. errors in client-provided data such as manifest)
    schema:
      $ref: '#/definitions/ErrorList'

tags:
- name: admin
  description: 'for admins only'
- name: users
  description: 'for users'
