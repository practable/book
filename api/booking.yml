  /users/{user_name}/bookings:
    get:
      summary: Get all current bookings for the user
      description: Get all current bookings for the user. It's assumed that no pagination will be required due to likely policy limits being a couple of bookings per policy and users typically having only a couple of policies. No pagination may cause issues for admins that book hundreds or thousands slots on behalf of students, although it is likely such bookings would be automated so no need to support rapid update of a GUI, at least for now.
      tags:
      - users
      operationId: GetBookingsForUser
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: user_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/Bookings'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'
          
  /users/{user_name}/bookings/{booking_name}:
    delete:
      summary: Cancel the booking
      description: Cancels an owned booking and revokes active Relay access. A booking:maintenance principal may cancel only its own maintenance booking. Returns 404 on successful cancellation, or if there is no such booking.
      tags:
      - users
      operationId: CancelBooking
      deprecated: false
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: user_name
        in: path
        required: true
        type: string
        description: ''
      - name: booking_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []
      responses:
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

    put:
      summary: Request the activity that goes with the booking
      description: Checks if the booking has started or not and if so, returns an activity that can be used to access the booked resource. Since this mutates the state of the booking (from unfulfilled to fulfilled) it is a put not a get.
      tags:
      - users
      operationId: GetActivity
      deprecated: false
      produces:
      - application/json
      parameters:
      - name: user_name
        in: path
        required: true
        type: string
        description: ''
      - name: booking_name
        in: path
        required: true
        type: string
        description: ''
      security:
        - Bearer: []
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/Activity'
          headers: {}
        401:
          $ref: '#/responses/Unauthorized'
        404:
          $ref: '#/responses/NotFound'
        500:
          $ref: '#/responses/InternalError'

  /users/{user_name}/bookings/{booking_name}/activations:
    post:
      summary: Begin durable preparation for a booking
      description: Resolves and starts every configured stream activation pipeline. Maintenance and compatibility clients may select one stream explicitly. Repeating the same Idempotency-Key returns the original activation.
      tags: [users]
      operationId: BeginBookingActivation
      consumes: [application/json]
      produces: [application/json]
      parameters:
      - {name: user_name, in: path, required: true, type: string}
      - {name: booking_name, in: path, required: true, type: string}
      - {name: Idempotency-Key, in: header, required: true, type: string, minLength: 1, maxLength: 200}
      - name: request
        in: body
        required: true
        schema: {$ref: '#/definitions/BookingActivationRequest'}
      security:
        - Bearer: []
      responses:
        202:
          description: Preparation is in progress
          schema: {$ref: '#/definitions/BookingActivation'}
        401: {$ref: '#/responses/Unauthorized'}
        404: {$ref: '#/responses/NotFound'}
        409: {$ref: '#/responses/Conflict'}
        500: {$ref: '#/responses/InternalError'}

  /users/{user_name}/bookings/{booking_name}/activations/{activation_id}:
